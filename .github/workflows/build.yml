name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            clang \
            libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

  upstream-sync:
    name: upstream vendored sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read pinned upstream commit
        id: upstream
        run: echo "commit=$(tr -d '[:space:]' < UPSTREAM_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out upstream desktop repository
        uses: actions/checkout@v4
        with:
          repository: Risaly-Noroki-Dev-Club/ale-my-eyes-desktop
          ref: ${{ steps.upstream.outputs.commit }}
          path: upstream
          persist-credentials: false

      - name: Verify vendored crates match the pinned upstream commit
        run: bash scripts/verify-upstream-sync.sh upstream

  build-aarch64:
    name: build (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      - name: Cross-compile release binaries
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: aarch64-unknown-linux-gnu
          toolchain: stable
          args: --locked --release -p ale-server

      - name: Inspect cross-compiled binary
        run: file target/aarch64-unknown-linux-gnu/release/ale-server

      - name: Assemble release tarball
        run: |
          bash scripts/package-tarball.sh \
            --skip-build \
            --bin-dir target/aarch64-unknown-linux-gnu/release \
            --dist dist

      - name: Show artifact checksums
        run: |
          sha256sum dist/*.tar.gz
          cat dist/*.sha256

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: ale-server-aarch64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
