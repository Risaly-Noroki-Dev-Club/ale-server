# systemd-tmpfiles(8) rules for ale-server.
#
# The system unit already creates these via StateDirectory=/ConfigurationDirectory=,
# so this file exists for setups that run ale-server without systemd (containers,
# manual runs) and to guarantee ownership/modes for both installation paths.
#
# Installed by scripts/install.sh to /usr/lib/tmpfiles.d/ale-server.conf.
# Type  Path         Mode User Group  Age
d       /var/lib/ale 0750 ale  ale    -
d       /etc/ale     0755 root root   -
